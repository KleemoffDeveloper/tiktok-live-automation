<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TikTok Gift Listener</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .container {
            width: 500px;
            padding: 30px;
            border-radius: 16px;
            background: #1c1c1c;
        }

        h1 {
            margin: 0 0 8px;
        }

        #status {
            margin-bottom: 20px;
            color: #888;
            font-size: 14px;
        }

        #gift {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
        }

        .gift-message {
            border: 1px solid white;
            display: grid;
            grid-template-columns: 100px 1fr;
        }

        .gift-image {
            /* max-width: 100%; */
            width: 100px;
            height: 100px;
            border: 1px solid red;
        }

        .empty {
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #292929;
            color: #777;
        }

        @keyframes giftEnter {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Scrollbar */

        #gift::-webkit-scrollbar {
            width: 6px;
        }

        #gift::-webkit-scrollbar-track {
            background: transparent;
        }

        #gift::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎁 Gift Listener</h1>

        <div id="status">
            Connecting...
        </div>

        <div id="gift">
            <div class="empty">
                Waiting for gifts...
            </div>
        </div>

    </div>

    <script>
        function renderGift(gift, animate = false) {
            const giftElement = document.createElement("div");

            giftElement.className = "gift-message";

            console.log(gift);

            if (gift.imageUrl) {
                const image = document.createElement("img");

                image.className = "gift-image";
                image.style.width = 100;
                image.style.height = 100;
                image.src = gift.imageUrl;
                image.alt = "TikTok Gift";

                giftElement.appendChild(image);
            }

            const message = document.createElement("div");

            message.className = "gift-message-text";
            message.textContent = gift.message;

            giftElement.appendChild(message);

            const empty = giftContainer.querySelector(".empty");

            if (empty) {
                empty.remove();
            }

            giftContainer.appendChild(giftElement);

            giftContainer.scrollTo({
                top: giftContainer.scrollHeight,
                behavior: "smooth"
            });
        }

        const stream = new EventSource("http://localhost:3000/gift");

        const status = document.getElementById("status");
        const giftContainer = document.getElementById("gift");

        const STORAGE_KEY = "tiktok_gifts";
        const DUPLICATE_WINDOW = 5000;

        // giftId -> timestamp
        const recentGiftIds = new Map();

        // Load existing gifts
        let gifts = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

        function saveGifts() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(gifts));
        }

        function renderGift(gift, animate = false) {
            const giftElement = document.createElement("div");

            giftElement.className = "gift-message";

            if (animate) {
                giftElement.classList.add("new");
            }

            const image = document.createElement("img");

            image.src = gift.imageUrl;
            image.alt = "TikTok Gift";

            const message = document.createElement("div");
            message.textContent = gift.message;

            giftElement.appendChild(image);
            giftElement.appendChild(message);

            const empty = giftContainer.querySelector(".empty");

            if (empty) {
                empty.remove();
            }

            giftContainer.appendChild(giftElement);

            giftContainer.scrollTo({
                top: giftContainer.scrollHeight,
                behavior: "smooth"
            });
        }

        // Restore persisted gifts
        gifts.forEach(gift => {
            renderGift(gift);
        });

        stream.onopen = () => {
            status.textContent = "● Connected";
            status.style.color = "#4ade80";
        };

        stream.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);

                const giftId = data.giftId;
                const message = data.common?.describe;

                // Gather available gift image URLs
                const imageUrls = data.gift?.image?.urlList || [];
                const imageUrl = imageUrls[0];
                console.log(imageUrls);

                if (!giftId || !message) {
                    return;
                }

                const now = Date.now();
                const previousTime = recentGiftIds.get(giftId);

                // Ignore duplicate event within 5 seconds
                if (
                    previousTime &&
                    now - previousTime < DUPLICATE_WINDOW
                ) {
                    console.log("Duplicate gift ignored:", giftId);
                    return;
                }

                recentGiftIds.set(giftId, now);

                const gift = {
                    giftId,
                    message,
                    imageUrl
                };

                console.log("Gift received:", gift);

                // Persist gift
                gifts.push(gift);

                saveGifts();

                // Render gift
                renderGift(gift, true);

            } catch (error) {
                console.error("Failed to process gift:", error);
            }
        };

        stream.onerror = (error) => {
            console.error("Gift stream error:", error);

            status.textContent = "● Disconnected";
            status.style.color = "#f87171";
        };

        // Clean old gift IDs
        setInterval(() => {
            const now = Date.now();

            for (const [giftId, timestamp] of recentGiftIds) {
                if (now - timestamp >= DUPLICATE_WINDOW) {
                    recentGiftIds.delete(giftId);
                }
            }
        }, 1000);
    </script>

</body>

</html>
